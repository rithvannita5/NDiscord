<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Conference - LiveKit</title>
  
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', 'Segoe UI', sans-serif; }
    body { background: #1a1a2e; color: #fff; min-height: 100vh; padding: 20px; }
    
    /* ============================================================
       LOGIN SCREEN
       ============================================================ */
    #login-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 15px;
    }
    .login-card {
      background: #16213e;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      border: 1px solid #2d2d44;
    }
    .login-card h1 { 
      color: #48cae4; 
      margin-bottom: 25px; 
      font-size: 28px;
      text-align: center;
    }
    .login-card input {
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid #3a506b;
      background: #0b132b;
      color: #fff;
      font-size: 16px;
      width: 100%;
      outline: none;
      margin-bottom: 15px;
    }
    .login-card input:focus { border-color: #48cae4; }
    .login-card button {
      padding: 14px 40px;
      background: #00b4d8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    .login-card button:hover { background: #0096c7; }
    .login-card button:disabled { background: #475569; cursor: not-allowed; }
    .error-message {
      color: #ef4444;
      font-size: 14px;
      text-align: center;
      padding: 10px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 8px;
      display: none;
      margin-bottom: 15px;
    }
    .error-message.show { display: block; }
    
    /* ============================================================
       LOBBY SCREEN (បន្ទាប់ពី Login)
       ============================================================ */
    #lobby-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 20px;
    }
    .lobby-card {
      background: #16213e;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      border: 1px solid #2d2d44;
      text-align: center;
    }
    .lobby-card h1 { color: #48cae4; margin-bottom: 15px; font-size: 24px; }
    .user-info {
      background: #0b132b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .user-info strong { color: #48cae4; }
    .lobby-card input {
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid #3a506b;
      background: #0b132b;
      color: #fff;
      font-size: 16px;
      width: 100%;
      outline: none;
      margin-bottom: 15px;
    }
    .lobby-card input:focus { border-color: #48cae4; }
    .lobby-card button {
      padding: 14px 40px;
      background: #00b4d8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      margin-bottom: 10px;
    }
    .lobby-card button:hover { background: #0096c7; }
    .lobby-card button.admin-btn {
      background: #8b5cf6;
    }
    .lobby-card button.admin-btn:hover { background: #7c3aed; }
    .lobby-card button.logout-btn {
      background: #475569;
      font-size: 14px;
      padding: 10px;
    }
    .lobby-card button.logout-btn:hover { background: #334155; }
    
    /* ============================================================
       MAIN APP
       ============================================================ */
    #app { display: none; }
    #app.active { display: block; }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #16213e;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .header h2 { color: #48cae4; font-size: 18px; }
    .header .user-badge {
      background: #0b132b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #94a3b8;
    }
    
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .controls button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .btn-primary { background: #00b4d8; color: #fff; }
    .btn-primary:hover { background: #0096c7; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn-warning:hover { background: #d97706; }
    .btn-purple { background: #8b5cf6; color: #fff; }
    .btn-purple:hover { background: #7c3aed; }
    .controls button.off { background: #ef4444; color: #fff; }
    
    .section-title {
      font-size: 14px;
      color: #94a3b8;
      margin: 15px 0 10px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid #2d2d44;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .video-box {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      border: 2px solid #2d2d44;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-box.screen-share { border-color: #f59e0b; }
    .video-box.screen-share video { object-fit: contain; }
    .video-box .name-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.75);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #fff;
      font-weight: 500;
      z-index: 2;
    }
    .video-box .status-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(16, 185, 129, 0.9);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: #fff;
      font-weight: bold;
      z-index: 2;
    }
    
    .screen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .participants-list {
      background: #16213e;
      padding: 20px;
      border-radius: 10px;
    }
    .participants-list h3 { color: #48cae4; margin-bottom: 15px; font-size: 16px; }
    .participant-item {
      padding: 10px 15px;
      background: #0b132b;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .participant-item .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    
    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 25px;
      background: #1c2541;
      border: 1px solid #48cae4;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      max-width: 90%;
      text-align: center;
    }
    #status.show { display: block; }
    
    @media (max-width: 768px) {
      .video-grid, .screen-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
      .controls { width: 100%; }
      .controls button { flex: 1; padding: 10px; font-size: 12px; }
      .login-card, .lobby-card { padding: 25px; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       LOGIN SCREEN
       ============================================================ -->
  <div id="login-screen">
    <div class="login-card">
      <h1>🔐 ចូលប្រើប្រាស់</h1>
      <div id="login-error" class="error-message"></div>
      <input type="text" id="loginUsername" placeholder="ឈ្មោះអ្នកប្រើ (Username)">
      <input type="password" id="loginPassword" placeholder="លេខសម្ងាត់ (Password)">
      <button id="loginBtn" onclick="login()">🔑 ចូល</button>
    </div>
  </div>

  <!-- ============================================================
       LOBBY SCREEN
       ============================================================ -->
  <div id="lobby-screen">
    <div class="lobby-card">
      <h1>🎥 Video Conference</h1>
      <div class="user-info">
        👤 សូមស្វាគមន៍ <strong id="lobbyUsername">-</strong>
      </div>
      <input type="text" id="roomNameInput" placeholder="ឈ្មោះបន្ទប់ (ឧ. meeting-1)" value="meeting-1">
      <button onclick="joinRoom()">🚀 ចូលបន្ទប់</button>
      <button id="adminBtn" class="admin-btn" onclick="openAdmin()" style="display:none;">👑 គ្រប់គ្រង Users</button>
      <button class="logout-btn" onclick="logout()">🚪 ចាកចេញពីគណនី</button>
    </div>
  </div>

  <!-- ============================================================
       MAIN APP
       ============================================================ -->
  <div id="app">
    <div class="header">
      <div>
        <h2>🎥 បន្ទប់: <span id="currentRoom">-</span></h2>
        <span class="user-badge">👤 <span id="currentUser">-</span></span>
      </div>
      <div class="controls">
        <button id="btnMic" class="btn-primary" onclick="toggleMic()">🎤 Mic On</button>
        <button id="btnCam" class="btn-primary" onclick="toggleCamera()">📹 Camera On</button>
        <button id="btnScreen" class="btn-warning" onclick="toggleScreenShare()">🖥️ Share Screen</button>
        <button class="btn-danger" onclick="leaveRoom()">🚪 ចាកចេញ</button>
      </div>
    </div>

    <h4 class="section-title" id="screenTitle" style="display:none;">🖥️ Screen Share</h4>
    <div class="screen-grid" id="screenGrid"></div>

    <h4 class="section-title">👤 Camera & Participants</h4>
    <div class="video-grid" id="videoGrid"></div>

    <div class="participants-list">
      <h3>👥 អ្នកចូលរួម (<span id="participantCount">0</span>)</h3>
      <div id="participantsList"></div>
    </div>
  </div>

  <div id="status"></div>

  <script>
    // ============================================================
    // GLOBAL VARIABLES
    // ============================================================
    let room = null;
    let localParticipant = null;
    let isMicOn = false;
    let isCameraOn = false;
    let isScreenSharing = false;
    let LIVEKIT_URL = 'wss://meeting-86lp77zt.livekit.cloud';
    let authToken = null;
    let currentUser = null;

    // ============================================================
    // CHECK SESSION ON LOAD
    // ============================================================
    window.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem('authToken');
      const savedUser = localStorage.getItem('currentUser');
      
      if (savedToken && savedUser) {
        authToken = savedToken;
        currentUser = JSON.parse(savedUser);
        showLobby();
      } else {
        showLogin();
      }
    });

    // ============================================================
    // SHOW/HIDE SCREENS
    // ============================================================
    function showLogin() {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('app').classList.remove('active');
    }

    function showLobby() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('lobby-screen').style.display = 'flex';
      document.getElementById('app').classList.remove('active');
      
      document.getElementById('lobbyUsername').textContent = currentUser.displayName || currentUser.username;
      
      // បង្ហាញ Admin Button ប្រសិនបើជា Admin
      if (currentUser.role === 'admin') {
        document.getElementById('adminBtn').style.display = 'block';
      } else {
        document.getElementById('adminBtn').style.display = 'none';
      }
    }

    // ============================================================
    // LOGIN
    // ============================================================
    async function login() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorDiv = document.getElementById('login-error');

      errorDiv.classList.remove('show');

      if (!username || !password) {
        errorDiv.textContent = 'សូមបំពេញឈ្មោះ និងលេខសម្ងាត់!';
        errorDiv.classList.add('show');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '⏳ កំពុងចូល...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Save session
        authToken = data.token;
        currentUser = data.user;
        localStorage.setItem('authToken', authToken);
        localStorage.setItem('currentUser', JSON.stringify(currentUser));

        console.log('✅ Login successful:', currentUser);
        showLobby();

      } catch (error) {
        console.error('Login error:', error);
        errorDiv.textContent = error.message;
        errorDiv.classList.add('show');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '🔑 ចូល';
      }
    }

    // ============================================================
    // LOGOUT
    // ============================================================
    function logout() {
      if (!confirm('តើអ្នកចង់ចាកចេញពីគណនីទេ?')) return;
      
      authToken = null;
      currentUser = null;
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
      
      document.getElementById('loginUsername').value = '';
      document.getElementById('loginPassword').value = '';
      
      showLogin();
      showStatus('🚪 បានចាកចេញពីគណនី');
    }

    // ============================================================
    // OPEN ADMIN DASHBOARD
    // ============================================================
    function openAdmin() {
      window.open('/admin.html', '_blank');
    }

    // ============================================================
    // JOIN ROOM
    // ============================================================
    async function joinRoom() {
      const roomName = document.getElementById('roomNameInput').value.trim();
      
      if (!roomName) {
        return alert('សូមបំពេញឈ្មោះបន្ទប់!');
      }

      showStatus('⏳ កំពុងភ្ជាប់...');

      try {
        // ទាញយក Token ពី Backend (មាន Authentication)
        const response = await fetch('/api/get-token', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ roomName })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Failed to get token');
        }

        if (data.url) LIVEKIT_URL = data.url;

        // បង្កើត Room
        room = new LivekitClient.Room({
          adaptiveStream: true,
          dynacast: true,
        });

        setupRoomEvents();

        // ភ្ជាប់ទៅ LiveKit
        await room.connect(LIVEKIT_URL, data.token);
        console.log('✅ Connected to room:', roomName);
        
        localParticipant = room.localParticipant;

        // ព្យាយាមបើកកាមេរ៉ា និងមេក្រូ
        try {
          await localParticipant.enableCameraAndMicrophone();
          isCameraOn = true;
          isMicOn = true;
        } catch (deviceError) {
          console.warn('⚠️ Camera/Mic not available:', deviceError.message);
          showStatus('⚠️ គ្មានកាមេរ៉ា/មេក្រូ - អ្នកអាច Share Screen បាន');
          
          try {
            await localParticipant.setMicrophoneEnabled(true);
            isMicOn = true;
          } catch (e) { isMicOn = false; }
          
          try {
            await localParticipant.setCameraEnabled(true);
            isCameraOn = true;
          } catch (e) { isCameraOn = false; }
        }
        
        // បង្ហាញ Local Video
        displayLocalTracks(currentUser.displayName || currentUser.username);

        // បង្ហាញអ្នកចូលរួមផ្សេងទៀត
        room.remoteParticipants.forEach(participant => {
          addParticipantToList(participant.identity);
          displayRemoteTracks(participant);
        });

        // បង្ហាញ UI
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('app').classList.add('active');
        document.getElementById('currentRoom').textContent = roomName;
        document.getElementById('currentUser').textContent = currentUser.displayName || currentUser.username;
        
        updateParticipantCount();
        updateMediaButtons();
        showStatus('✅ ភ្ជាប់បានជោគជ័យ!');

      } catch (error) {
        console.error('❌ Error joining room:', error);
        showStatus('❌ មិនអាចភ្ជាប់បានទេ: ' + error.message);
      }
    }

    // ============================================================
    // DISPLAY LOCAL TRACKS
    // ============================================================
    function displayLocalTracks(username) {
      try {
        const videoPublications = Array.from(localParticipant.videoTrackPublications.values());
        videoPublications.forEach(pub => {
          if (pub.track) {
            attachVideoTrack(pub.track, username + ' (អ្នក)', pub.source === 'screen_share');
          }
        });

        const audioPublications = Array.from(localParticipant.audioTrackPublications.values());
        audioPublications.forEach(pub => {
          if (pub.track) pub.track.attach();
        });
      } catch (error) {
        console.warn('Error displaying local tracks:', error);
      }
    }

    // ============================================================
    // DISPLAY REMOTE TRACKS
    // ============================================================
    function displayRemoteTracks(participant) {
      try {
        const videoPublications = Array.from(participant.videoTrackPublications.values());
        videoPublications.forEach(pub => {
          if (pub.isSubscribed && pub.track) {
            attachVideoTrack(pub.track, participant.identity, pub.source === 'screen_share');
          }
        });

        const audioPublications = Array.from(participant.audioTrackPublications.values());
        audioPublications.forEach(pub => {
          if (pub.isSubscribed && pub.track) pub.track.attach();
        });
      } catch (error) {
        console.warn('Error displaying remote tracks:', error);
      }
    }

    // ============================================================
    // SETUP ROOM EVENTS
    // ============================================================
    function setupRoomEvents() {
      room.on('participantConnected', (participant) => {
        console.log('👤 Connected:', participant.identity);
        addParticipantToList(participant.identity);
        updateParticipantCount();
        showStatus('👤 ' + participant.identity + ' បានចូលរួម');
        setTimeout(() => displayRemoteTracks(participant), 500);
      });

      room.on('participantDisconnected', (participant) => {
        console.log('👤 Disconnected:', participant.identity);
        removeParticipantFromList(participant.identity);
        removeVideoByParticipant(participant.identity, false);
        removeVideoByParticipant(participant.identity, true);
        updateParticipantCount();
        showStatus('👤 ' + participant.identity + ' បានចាកចេញ');
      });

      room.on('trackSubscribed', (track, publication, participant) => {
        console.log('📺 Track subscribed:', track.kind, 'from', participant.identity);
        if (track.kind === 'video') {
          const isScreen = publication.source === 'screen_share';
          attachVideoTrack(track, participant.identity, isScreen);
        } else if (track.kind === 'audio') {
          track.attach();
        }
      });

      room.on('trackUnsubscribed', (track, publication, participant) => {
        track.detach();
        if (publication.source === 'screen_share') {
          removeVideoByParticipant(participant.identity, true);
        }
      });

      room.on('localTrackPublished', (publication) => {
        if (publication.source === 'screen_share' && publication.track) {
          attachVideoTrack(publication.track, localParticipant.identity + ' (អ្នក)', true);
        } else if (publication.kind === 'video' && publication.track) {
          attachVideoTrack(publication.track, localParticipant.identity + ' (អ្នក)', false);
        }
      });

      room.on('localTrackUnpublished', (publication) => {
        if (publication.source === 'screen_share') {
          removeVideoByParticipant(localParticipant.identity + ' (អ្នក)', true);
        }
      });

      room.on('disconnected', () => {
        console.log('🔌 Disconnected from room');
        leaveRoom();
      });
    }

    // ============================================================
    // ATTACH VIDEO TRACK
    // ============================================================
    function attachVideoTrack(track, name, isScreen = false) {
      if (!track) return;
      
      const videoElement = track.attach();
      videoElement.autoplay = true;
      videoElement.playsInline = true;
      
      if (name.includes('អ្នក')) {
        videoElement.muted = true;
      }

      const safeName = name.replace(/[^a-zA-Z0-9\u1780-\u17FF]/g, '-');
      const boxId = (isScreen ? 'screen-' : 'video-') + safeName;
      const gridId = isScreen ? 'screenGrid' : 'videoGrid';
      
      let box = document.getElementById(boxId);
      if (box) {
        const oldVideo = box.querySelector('video');
        if (oldVideo) oldVideo.remove();
        box.insertBefore(videoElement, box.firstChild);
        return;
      }

      box = document.createElement('div');
      box.className = 'video-box' + (isScreen ? ' screen-share' : '');
      box.id = boxId;
      box.innerHTML = `
        <div class="name-tag">${isScreen ? '🖥️ ' : '👤 '}${name}</div>
        <div class="status-tag">🟢 Live</div>
      `;
      box.insertBefore(videoElement, box.firstChild);
      document.getElementById(gridId).appendChild(box);
      
      if (isScreen) {
        document.getElementById('screenTitle').style.display = 'block';
      }
    }

    function removeVideoByParticipant(name, isScreen = false) {
      const safeName = name.replace(/[^a-zA-Z0-9\u1780-\u17FF]/g, '-');
      const box = document.getElementById((isScreen ? 'screen-' : 'video-') + safeName);
      if (box) box.remove();
      
      if (isScreen) {
        const screenGrid = document.getElementById('screenGrid');
        if (screenGrid.children.length === 0) {
          document.getElementById('screenTitle').style.display = 'none';
        }
      }
    }

    function updateMediaButtons() {
      const btnMic = document.getElementById('btnMic');
      btnMic.innerHTML = isMicOn ? '🎤 Mic On' : '🔇 Mic Off';
      btnMic.className = isMicOn ? 'btn-primary' : 'btn-primary off';
      
      const btnCam = document.getElementById('btnCam');
      btnCam.innerHTML = isCameraOn ? '📹 Camera On' : '📷 Camera Off';
      btnCam.className = isCameraOn ? 'btn-primary' : 'btn-primary off';
    }

    async function toggleMic() {
      if (!localParticipant) return;
      try {
        isMicOn = !isMicOn;
        await localParticipant.setMicrophoneEnabled(isMicOn);
        updateMediaButtons();
        showStatus(isMicOn ? '🎤 បើកមេក្រូ' : '🔇 បិទមេក្រូ');
      } catch (error) {
        isMicOn = !isMicOn;
        showStatus('⚠️ មិនអាចប្តូរមេក្រូបានទេ');
        updateMediaButtons();
      }
    }

    async function toggleCamera() {
      if (!localParticipant) return;
      try {
        isCameraOn = !isCameraOn;
        await localParticipant.setCameraEnabled(isCameraOn);
        updateMediaButtons();
        if (!isCameraOn) {
          removeVideoByParticipant(localParticipant.identity + ' (អ្នក)', false);
        }
        showStatus(isCameraOn ? '📹 បើកកាមេរ៉ា' : '📷 បិទកាមេរ៉ា');
      } catch (error) {
        isCameraOn = !isCameraOn;
        showStatus('⚠️ មិនអាចប្តូរកាមេរ៉ាបានទេ');
        updateMediaButtons();
      }
    }

    async function toggleScreenShare() {
      if (!localParticipant) return;
      try {
        isScreenSharing = !isScreenSharing;
        await localParticipant.setScreenShareEnabled(isScreenSharing, {
          audio: true,
          video: { resolution: LivekitClient.VideoPresets.h1080.resolution }
        });
        
        const btn = document.getElementById('btnScreen');
        btn.innerHTML = isScreenSharing ? '🛑 Stop Sharing' : '🖥️ Share Screen';
        btn.className = isScreenSharing ? 'btn-danger' : 'btn-warning';
        
        showStatus(isScreenSharing ? '🖥️ ចាប់ផ្តើម Share Screen' : '🖥️ បញ្ចប់ Share Screen');
        
        if (!isScreenSharing) {
          removeVideoByParticipant(localParticipant.identity + ' (អ្នក)', true);
        }
      } catch (error) {
        isScreenSharing = false;
        const btn = document.getElementById('btnScreen');
        btn.innerHTML = '🖥️ Share Screen';
        btn.className = 'btn-warning';
        showStatus('❌ បោះបង់ការ Share Screen');
      }
    }

    function addParticipantToList(name) {
      const list = document.getElementById('participantsList');
      const safeName = name.replace(/[^a-zA-Z0-9\u1780-\u17FF]/g, '-');
      const itemId = 'p-' + safeName;
      if (document.getElementById(itemId)) return;
      
      const item = document.createElement('div');
      item.className = 'participant-item';
      item.id = itemId;
      item.innerHTML = `<div class="dot"></div> ${name}`;
      list.appendChild(item);
    }

    function removeParticipantFromList(name) {
      const safeName = name.replace(/[^a-zA-Z0-9\u1780-\u17FF]/g, '-');
      const item = document.getElementById('p-' + safeName);
      if (item) item.remove();
    }

    function updateParticipantCount() {
      if (!room) return;
      const count = room.remoteParticipants.size + 1;
      document.getElementById('participantCount').textContent = count;
      
      if (localParticipant) {
        addParticipantToList(localParticipant.identity + ' (អ្នក)');
      }
    }

    async function leaveRoom() {
      if (room) {
        try { await room.disconnect(); } catch (e) {}
        room = null;
        localParticipant = null;
      }
      
      document.getElementById('videoGrid').innerHTML = '';
      document.getElementById('screenGrid').innerHTML = '';
      document.getElementById('participantsList').innerHTML = '';
      document.getElementById('screenTitle').style.display = 'none';
      document.getElementById('participantCount').textContent = '0';
      document.getElementById('app').classList.remove('active');
      
      isMicOn = false;
      isCameraOn = false;
      isScreenSharing = false;
      
      document.getElementById('btnMic').innerHTML = '🎤 Mic On';
      document.getElementById('btnMic').className = 'btn-primary';
      document.getElementById('btnCam').innerHTML = '📹 Camera On';
      document.getElementById('btnCam').className = 'btn-primary';
      document.getElementById('btnScreen').innerHTML = '🖥️ Share Screen';
      document.getElementById('btnScreen').className = 'btn-warning';
      
      // ត្រឡប់ទៅ Lobby
      showLobby();
      showStatus('🚪 បានចាកចេញពីបន្ទប់');
    }

    function showStatus(message) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.classList.add('show');
      clearTimeout(status.timeout);
      status.timeout = setTimeout(() => status.classList.remove('show'), 4000);
    }

    // Enter key shortcuts
    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
    document.getElementById('loginUsername').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginPassword').focus();
    });
  </script>
</body>
</html>
