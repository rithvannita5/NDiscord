<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Conference</title>
  
  <meta name="theme-color" content="#00b4d8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300b4d8'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='36' font-weight='bold' fill='white' text-anchor='middle'%3EVC%3C/text%3E%3C/svg%3E" type="image/svg+xml">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Kantumruy Pro', 'Noto Sans Khmer', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { 
      background: #1a1a2e; 
      color: #fff; 
      min-height: 100vh; 
      padding: 20px;
      line-height: 1.6;
    }
    
    /* LOGIN */
    #login-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: #16213e;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 440px;
      border: 1px solid #2d2d44;
    }
    .login-card h1 { 
      color: #48cae4; 
      margin-bottom: 25px; 
      font-size: 26px; 
      text-align: center;
      font-weight: 700;
    }
    .login-card input,
    .login-card select {
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid #3a506b;
      background: #0b132b;
      color: #fff;
      font-size: 16px;
      width: 100%;
      outline: none;
      margin-bottom: 15px;
      font-family: inherit;
    }
    .login-card input:focus,
    .login-card select:focus { 
      border-color: #48cae4;
      box-shadow: 0 0 0 3px rgba(72, 202, 228, 0.1);
    }
    .login-card label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }
    .login-card button {
      padding: 14px 40px;
      background: #00b4d8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-family: inherit;
    }
    .login-card button:hover { background: #0096c7; }
    .login-card button:disabled { background: #475569; cursor: not-allowed; }
    .error-message {
      color: #ef4444;
      font-size: 14px;
      text-align: center;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 8px;
      display: none;
      margin-bottom: 15px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .error-message.show { display: block; }
    
    /* OTP */
    #otp-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #otp-modal.active { display: flex; }
    .otp-card {
      background: #16213e;
      padding: 40px;
      border-radius: 15px;
      max-width: 420px;
      width: 100%;
      border: 2px solid #f59e0b;
      text-align: center;
    }
    .otp-card h2 { color: #f59e0b; margin-bottom: 15px; }
    .otp-card p { color: #cbd5e1; margin-bottom: 20px; font-size: 14px; }
    .otp-card input {
      padding: 16px;
      border-radius: 10px;
      border: 2px solid #3a506b;
      background: #0b132b;
      color: #fff;
      font-size: 24px;
      width: 100%;
      outline: none;
      text-align: center;
      letter-spacing: 8px;
      font-weight: bold;
      margin-bottom: 20px;
      font-family: 'Courier New', monospace;
    }
    .otp-card input:focus { border-color: #f59e0b; }
    .otp-card button {
      padding: 14px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
      font-family: inherit;
    }
    .otp-card .btn-verify { background: #10b981; color: #fff; }
    .otp-card .btn-cancel { background: #ef4444; color: #fff; font-size: 14px; padding: 10px; }
    
    /* MAIN APP */
    #app { display: none; }
    #app.active { display: block; }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #16213e;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .header h2 { color: #48cae4; font-size: 18px; }
    .header .user-badge {
      background: #0b132b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 5px;
      display: inline-block;
    }
    
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .controls button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: #00b4d8; color: #fff; }
    .btn-primary:hover { background: #0096c7; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn-warning:hover { background: #d97706; }
    .btn-purple { background: #8b5cf6; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-secondary { background: #475569; color: #fff; }
    .controls button.off { background: #ef4444; color: #fff; }
    
    .section-title {
      font-size: 14px;
      color: #94a3b8;
      margin: 15px 0 10px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid #2d2d44;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    
    .screen-grid, .video-grid {
      display: grid;
      gap: 15px;
      margin-bottom: 25px;
    }
    .screen-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .video-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    
    .video-box {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      border: 2px solid #2d2d44;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .video-box:hover {
      border-color: #48cae4;
      transform: scale(1.02);
      box-shadow: 0 8px 25px rgba(72, 202, 228, 0.3);
    }
    .video-box.screen-share { border-color: #f59e0b; }
    .video-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-box.screen-share video { object-fit: contain; }
    .video-box .name-tag {
      position: absolute;
      bottom: 10px; left: 10px;
      background: rgba(0,0,0,0.75);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 2;
    }
    .video-box .status-tag {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(16, 185, 129, 0.9);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      z-index: 2;
    }
    .video-box .expand-icon {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .video-box:hover .expand-icon { opacity: 1; }
    
    .participants-list {
      background: #16213e;
      padding: 20px;
      border-radius: 10px;
    }
    .participants-list h3 { color: #48cae4; margin-bottom: 15px; font-size: 16px; }
    .participant-item {
      padding: 10px 15px;
      background: #0b132b;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
    }
    .participant-item .info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .participant-item .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .participant-item .remote-btn {
      padding: 5px 12px;
      background: #f59e0b;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    
    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 25px;
      background: #1c2541;
      border: 1px solid #48cae4;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      z-index: 9999;
      max-width: 90%;
      text-align: center;
    }
    #status.show { display: block; }
    
    #fullscreenModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 10000;
      flex-direction: column;
      padding: 20px;
    }
    #fullscreenModal.active { display: flex; }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #16213e;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .modal-header .modal-title { color: #48cae4; font-size: 18px; font-weight: 600; }
    .modal-header button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #00b4d8;
      color: #fff;
      font-family: inherit;
    }
    .modal-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .modal-body video { width: 100%; height: 100%; object-fit: contain; }
    
    #remoteRequestModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99998;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #remoteRequestModal.active { display: flex; }
    .remote-request-card {
      background: #16213e;
      padding: 40px;
      border-radius: 15px;
      max-width: 420px;
      width: 100%;
      border: 2px solid #f59e0b;
      text-align: center;
    }
    .remote-request-card h2 { color: #f59e0b; margin-bottom: 15px; }
    .remote-request-card p { color: #cbd5e1; margin-bottom: 20px; font-size: 14px; }
    .remote-request-card button {
      padding: 14px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
      font-family: inherit;
    }
    .btn-approve { background: #10b981; color: #fff; }
    .btn-reject { background: #ef4444; color: #fff; }
    
    /* LOADING OVERLAY */
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 99999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
    }
    #loadingOverlay.active { display: flex; }
    #loadingOverlay .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(72, 202, 228, 0.2);
      border-top-color: #48cae4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loadingOverlay .loading-text {
      color: #48cae4;
      font-size: 18px;
      font-weight: 600;
    }
    
    @media (max-width: 768px) {
      .screen-grid, .video-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
      .controls { width: 100%; }
      .controls button { flex: 1; padding: 10px; font-size: 12px; }
      body { padding: 10px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <h1>🔐 ចូលប្រើប្រាស់</h1>
      <div id="login-error" class="error-message"></div>
      <input type="text" id="loginUsername" placeholder="ឈ្មោះអ្នកប្រើ">
      <input type="password" id="loginPassword" placeholder="លេខសម្ងាត់">
      
      <label>🚪 ជ្រើសរើសបន្ទប់:</label>
      <select id="roomSelect">
        <option value="">-- កំពុងផ្ទុក... --</option>
      </select>
      
      <button id="loginBtn" onclick="login()">🔑 ចូល</button>
    </div>
  </div>

  <!-- OTP MODAL -->
  <div id="otp-modal">
    <div class="otp-card">
      <h2>🔐 ផ្ទៀងផ្ទាត់ 2FA</h2>
      <p>គណនីរបស់អ្នកកំពុង Online នៅឧបករណ៍ផ្សេង។ សូមបញ្ចូលលេខកូដ ៦ ខ្ទង់។</p>
      <input type="text" id="otpInput" placeholder="______" maxlength="6" inputmode="numeric">
      <button class="btn-verify" onclick="verifyOTP()">✅ បញ្ជាក់</button>
      <button class="btn-cancel" onclick="cancelOTP()">❌ បោះបង់</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <div class="header">
      <div>
        <h2>🎥 បន្ទប់: <span id="currentRoom">-</span></h2>
        <span class="user-badge">👤 <span id="currentUser">-</span></span>
      </div>
      <div class="controls">
        <button id="adminBtn" class="btn-purple" onclick="openAdmin()" style="display:none;">👑 Dashboard</button>
        <button id="btnMic" class="btn-primary" onclick="toggleMic()">🎤 បើកមេក្រូ</button>
        <button id="btnCam" class="btn-primary" onclick="toggleCamera()">📹 បើកកាមេរ៉ា</button>
        <button id="btnScreen" class="btn-warning" onclick="toggleScreenShare()">🖥️ ចែកអេក្រង់</button>
        <button class="btn-secondary" onclick="logout()">🚪 ចាកចេញគណនី</button>
        <button class="btn-danger" onclick="leaveRoom()">🚪 ចាកចេញបន្ទប់</button>
      </div>
    </div>

    <h4 class="section-title" id="screenTitle" style="display:none;">
      🖥️ ការចែកអេក្រង់ (<span id="screenCount">0</span>)
    </h4>
    <div class="screen-grid" id="screenGrid"></div>

    <h4 class="section-title">
      👤 កាមេរ៉ា និងអ្នកចូលរួម (<span id="videoCount">0</span>)
    </h4>
    <div class="video-grid" id="videoGrid"></div>

    <div class="participants-list">
      <h3>👥 អ្នកចូលរួម (<span id="participantCount">0</span>)</h3>
      <div id="participantsList"></div>
    </div>
  </div>

  <!-- FULLSCREEN -->
  <div id="fullscreenModal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">📺 Video</div>
      <button onclick="closeFullscreen()">✕ បិទ</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>

  <!-- REMOTE REQUEST MODAL -->
  <div id="remoteRequestModal">
    <div class="remote-request-card">
      <h2>🖥️ សំណើរ Remote Control</h2>
      <p><strong id="remoteRequesterName">-</strong> ចង់គ្រប់គ្រង Screen របស់អ្នក!<br>តើអ្នកអនុញ្ញាតទេ?</p>
      <button class="btn-approve" onclick="approveRemote()">✅ អនុញ្ញាត</button>
      <button class="btn-reject" onclick="rejectRemote()">❌ បដិសេធ</button>
    </div>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">⏳ កំពុងភ្ជាប់...</div>
  </div>

  <div id="status"></div>

  <script>
    // ============================================================
    // GLOBAL VARIABLES
    // ============================================================
    let room = null;
    let localParticipant = null;
    let isMicOn = false;
    let isCameraOn = false;
    let isScreenSharing = false;
    let LIVEKIT_URL = 'wss://meeting-86lp77zt.livekit.cloud';
    let authToken = null;
    let currentUser = null;
    let pendingLoginData = null;
    let deferredPrompt = null;
    let currentRemoteRequest = null;
    let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // ✅ FORCE UPDATE VERSION
    const APP_VERSION = 'v13';
    if (localStorage.getItem('appVersion') !== APP_VERSION) {
      localStorage.clear();
      sessionStorage.clear();
      localStorage.setItem('appVersion', APP_VERSION);
      if ('caches' in window) {
        caches.keys().then(names => names.forEach(name => caches.delete(name)));
      }
    }

    // ============================================================
    // ✅ SHOW/HIDE LOADING OVERLAY
    // ============================================================
    function showLoading(text) {
      const overlay = document.getElementById('loadingOverlay');
      document.getElementById('loadingText').textContent = text || '⏳ កំពុងភ្ជាប់...';
      overlay.classList.add('active');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }

    // ============================================================
    // ✅ INIT - ពិនិត្យ URL Parameter + autoJoinRoom មុនគេ
    // ============================================================
    window.addEventListener('DOMContentLoaded', async () => {
      // ✅ ពិនិត្យ URL parameter `?autoJoin=roomId`
      const urlParams = new URLSearchParams(window.location.search);
      const urlRoom = urlParams.get('autoJoin');
      
      if (urlRoom) {
        localStorage.setItem('autoJoinRoom', urlRoom);
        // លុប URL parameter ចេញ
        window.history.replaceState({}, '', '/');
      }
      
      const savedToken = localStorage.getItem('authToken');
      const savedUser = localStorage.getItem('currentUser');
      const autoJoinRoom = localStorage.getItem('autoJoinRoom');
      
      // ✅ ប្រសិនបើមាន autoJoinRoom + session → ចូលបន្ទប់ភ្លាម
      if (autoJoinRoom && savedToken && savedUser) {
        authToken = savedToken;
        currentUser = JSON.parse(savedUser);
        localStorage.removeItem('autoJoinRoom');
        
        console.log('🚀 Auto-joining room:', autoJoinRoom);
        showLoading('⏳ កំពុងចូលបន្ទប់ ' + autoJoinRoom + '...');
        
        await joinRoom(autoJoinRoom);
        
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
        return;
      }
      
      // ✅ ប្រសិនបើមាន session ធម្មតា
      if (savedToken && savedUser) {
        authToken = savedToken;
        currentUser = JSON.parse(savedUser);
        await handlePostLogin();
      } else {
        showLogin();
        await loadPublicRooms();
      }
      
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    });

    // ============================================================
    // PWA
    // ============================================================
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function installApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
    }

    // ============================================================
    // LOAD PUBLIC ROOMS (សម្រាប់ Login Screen)
    // ============================================================
    async function loadPublicRooms() {
      try {
        const res = await fetch('/api/rooms/public');
        const data = await res.json();
        
        const select = document.getElementById('roomSelect');
        select.innerHTML = '<option value="">-- ជ្រើសរើសបន្ទប់ --</option>';
        
        data.rooms.forEach(room => {
          const opt = document.createElement('option');
          opt.value = room.roomId;
          opt.textContent = `🚪 ${room.roomName || room.roomId}`;
          select.appendChild(opt);
        });
      } catch (error) {
        console.error('Error loading rooms:', error);
      }
    }

    // ============================================================
    // SHOW LOGIN
    // ============================================================
    function showLogin() {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app').classList.remove('active');
      hideLoading();
    }

    // ============================================================
    // LOGIN
    // ============================================================
    async function login() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const selectedRoom = document.getElementById('roomSelect').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorDiv = document.getElementById('login-error');

      errorDiv.classList.remove('show');

      if (!username || !password) {
        errorDiv.textContent = 'សូមបំពេញឈ្មោះ និងលេខសម្ងាត់!';
        errorDiv.classList.add('show');
        return;
      }

      if (!selectedRoom) {
        errorDiv.textContent = 'សូមជ្រើសរើសបន្ទប់!';
        errorDiv.classList.add('show');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '⏳ កំពុងចូល...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            username, 
            password,
            deviceId: getDeviceId(),
            selectedRoom: selectedRoom
          })
        });

        const data = await response.json();

        if (data.requires2FA) {
          pendingLoginData = { username, password, selectedRoom };
          document.getElementById('otp-modal').classList.add('active');
          document.getElementById('otpInput').focus();
          return;
        }

        if (!response.ok) throw new Error(data.error);

        authToken = data.token;
        currentUser = data.user;
        localStorage.setItem('authToken', authToken);
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        localStorage.setItem('deviceId', getDeviceId());

        await handlePostLogin(data.selectedRoom || selectedRoom);

      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.add('show');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '🔑 ចូល';
      }
    }

    function getDeviceId() {
      let deviceId = localStorage.getItem('deviceId');
      if (!deviceId) {
        deviceId = 'device-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
        localStorage.setItem('deviceId', deviceId);
      }
      return deviceId;
    }

    // ============================================================
    // ✅ POST LOGIN HANDLER
    // ============================================================
    async function handlePostLogin(selectedRoom) {
      // ✅ ជាដំបូង: ពិនិត្យ autoJoinRoom
      const autoJoinRoom = localStorage.getItem('autoJoinRoom');
      
      if (autoJoinRoom) {
        localStorage.removeItem('autoJoinRoom');
        console.log('🚀 Auto-joining room:', autoJoinRoom);
        showLoading('⏳ កំពុងចូលបន្ទប់...');
        await joinRoom(autoJoinRoom);
        return;
      }
      
      // ✅ Admin/Supervisor → បើក Dashboard
      if (currentUser.role === 'admin' || currentUser.role === 'supervisor') {
        showStatus('✅ ចូលជោគជ័យ! កំពុងបើក Dashboard...');
        setTimeout(() => {
          window.location.href = '/admin.html';
        }, 800);
        return;
      }
      
      // ✅ User ធម្មតា → ចូលបន្ទប់ដែលបានជ្រើស
      if (selectedRoom) {
        await joinRoom(selectedRoom);
      } else {
        try {
          const res = await fetch('/api/rooms/my-rooms', {
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
          const data = await res.json();
          
          if (data.rooms.length > 0) {
            await joinRoom(data.rooms[0].roomId);
          } else {
            showLogin();
            showStatus('⚠️ អ្នកគ្មានបន្ទប់ទេ!');
          }
        } catch (error) {
          showLogin();
          showStatus('❌ មានបញ្ហា!');
        }
      }
    }

    async function verifyOTP() {
      const otp = document.getElementById('otpInput').value.trim();
      if (!otp || otp.length !== 6) return alert('បញ្ចូល ៦ ខ្ទង់!');

      try {
        const response = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: pendingLoginData.username,
            password: pendingLoginData.password,
            otp,
            deviceId: getDeviceId(),
            selectedRoom: pendingLoginData.selectedRoom
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error);

        authToken = data.token;
        currentUser = data.user;
        localStorage.setItem('authToken', authToken);
        localStorage.setItem('currentUser', JSON.stringify(currentUser));

        document.getElementById('otp-modal').classList.remove('active');
        document.getElementById('otpInput').value = '';
        pendingLoginData = null;

        await handlePostLogin(data.selectedRoom);
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    function cancelOTP() {
      document.getElementById('otp-modal').classList.remove('active');
      document.getElementById('otpInput').value = '';
      pendingLoginData = null;
    }

    // ============================================================
    // LOGOUT
    // ============================================================
    async function logout() {
      if (!confirm('ចាកចេញពីគណនីទេ?')) return;
      
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          }
        });
      } catch (e) {}
      
      if (room) await leaveRoom(false);
      
      authToken = null;
      currentUser = null;
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
      localStorage.removeItem('deviceId');
      localStorage.removeItem('autoJoinRoom');
      
      document.getElementById('loginUsername').value = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('roomSelect').value = '';
      
      showLogin();
      await loadPublicRooms();
      showStatus('🚪 បានចាកចេញពីគណនី');
    }

    function openAdmin() {
      window.location.href = '/admin.html';
    }

    // ============================================================
    // ✅ JOIN ROOM
    // ============================================================
    async function joinRoom(roomName) {
      console.log('📞 joinRoom called:', roomName);
      showLoading('⏳ កំពុងចូលបន្ទប់ ' + roomName + '...');

      try {
        const response = await fetch('/api/get-token', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ roomName })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          hideLoading();
          
          // ✅ ប្រសិនបើ Admin មានបញ្ហា → ត្រឡប់ទៅ Dashboard
          if (currentUser && (currentUser.role === 'admin' || currentUser.role === 'supervisor')) {
            showStatus('❌ ' + data.error);
            setTimeout(() => {
              window.location.href = '/admin.html';
            }, 1500);
            return;
          }
          throw new Error(data.error);
        }

        if (data.url) LIVEKIT_URL = data.url;

        room = new LivekitClient.Room({
          adaptiveStream: true,
          dynacast: true,
        });

        setupRoomEvents();

        await room.connect(LIVEKIT_URL, data.token);
        console.log('✅ Connected:', roomName);
        
        localParticipant = room.localParticipant;

        try {
          await localParticipant.setMicrophoneEnabled(true);
          isMicOn = true;
        } catch (e) { isMicOn = false; }

        displayLocalTracks(currentUser.displayName || currentUser.username);

        room.remoteParticipants.forEach(participant => {
          addParticipantToList(participant.identity);
          displayRemoteTracks(participant);
        });

        await fetch('/api/online/join', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ roomId: roomName })
        });

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').classList.add('active');
        document.getElementById('currentRoom').textContent = roomName;
        document.getElementById('currentUser').textContent = currentUser.displayName || currentUser.username;
        
        // ✅ បង្ហាញ Admin Button
        if (currentUser.role === 'admin' || currentUser.role === 'supervisor') {
          document.getElementById('adminBtn').style.display = 'inline-block';
        }
        
        updateParticipantCount();
        updateMediaButtons();
        hideLoading();
        showStatus('✅ ភ្ជាប់ជោគជ័យ!');
        
        setTimeout(checkRemoteRequests, 2000);

      } catch (error) {
        console.error('❌ Error:', error);
        hideLoading();
        showStatus('❌ ' + error.message);
        
        // ✅ ត្រឡប់ទៅ Admin Dashboard ប្រសិនបើជា Admin
        if (currentUser && (currentUser.role === 'admin' || currentUser.role === 'supervisor')) {
          setTimeout(() => {
            window.location.href = '/admin.html';
          }, 1500);
        } else {
          showLogin();
          await loadPublicRooms();
        }
      }
    }

    function displayLocalTracks(username) {
      try {
        const videoPublications = Array.from(localParticipant.videoTrackPublications.values());
        videoPublications.forEach(pub => {
          if (pub.track) {
            attachVideoTrack(pub.track, username + ' (អ្នក)', pub.source === 'screen_share');
          }
        });

        const audioPublications = Array.from(localParticipant.audioTrackPublications.values());
        audioPublications.forEach(pub => {
          if (pub.track) pub.track.attach();
        });
      } catch (error) {}
    }

    function displayRemoteTracks(participant) {
      try {
        const videoPublications = Array.from(participant.videoTrackPublications.values());
        videoPublications.forEach(pub => {
          if (pub.isSubscribed && pub.track) {
            attachVideoTrack(pub.track, participant.identity, pub.source === 'screen_share');
          }
        });

        const audioPublications = Array.from(participant.audioTrackPublications.values());
        audioPublications.forEach(pub => {
          if (pub.isSubscribed && pub.track) pub.track.attach();
        });
      } catch (error) {}
    }

    function setupRoomEvents() {
      room.on('participantConnected', (participant) => {
        addParticipantToList(participant.identity);
        updateParticipantCount();
        showStatus('👤 ' + participant.identity + ' បានចូល');
        setTimeout(() => displayRemoteTracks(participant), 500);
      });

      room.on('participantDisconnected', (participant) => {
        removeParticipantFromList(participant.identity);
        removeVideoByParticipant(participant.identity, false);
        removeVideoByParticipant(participant.identity, true);
        updateParticipantCount();
      });

      room.on('trackSubscribed', (track, publication, participant) => {
        if (track.kind === 'video') {
          attachVideoTrack(track, participant.identity, publication.source === 'screen_share');
        } else if (track.kind === 'audio') {
          track.attach();
        }
      });

      room.on('trackUnsubscribed', (track, publication, participant) => {
        track.detach();
        if (publication.source === 'screen_share') {
          removeVideoByParticipant(participant.identity, true);
        }
      });

      room.on('localTrackPublished', (publication) => {
        if (publication.source === 'screen_share' && publication.track) {
          attachVideoTrack(publication.track, localParticipant.identity + ' (អ្នក)', true);
        } else if (publication.kind === 'video' && publication.track) {
          attachVideoTrack(publication.track, localParticipant.identity + ' (អ្នក)', false);
        }
      });

      room.on('localTrackUnpublished', (publication) => {
        if (publication.source === 'screen_share') {
          removeVideoByParticipant(localParticipant.identity + ' (អ្នក)', true);
        }
      });

      room.on('disconnected', () => leaveRoom(false));
    }

    function attachVideoTrack(track, name, isScreen = false) {
      if (!track) return;
      
      const safeName = name.replace(/[^a-zA-Z0-9\u1780-\u17FF]/g, '-');
      const boxId = (isScreen ? 'screen-' : 'video-') + safeName;
      const gridId = isScreen ? 'screenGrid' : 'videoGrid';
      
      let box = document.getElementById(boxId);
      if (box) {
        const oldVideo = box.querySelector('video');
        if (oldVideo && oldVideo.srcObject && oldVideo.srcObject.id === track.mediaStreamTrack.id) return;
        if (oldVideo) oldVideo.remove();
        
        const videoElement = track.attach();
        videoElement.autoplay = true;
        videoElement.playsInline = true;
        if (name.includes('អ្នក')) videoElement.muted = true;
        box.insertBefore(videoElement, box.firstChild);
        return;
      }

      const videoElement = track.attach();
      videoElement.autoplay = true;
      videoElement.playsInline = true;
      if (name.includes('អ្នក')) videoElement.muted = true;

      box = document.createElement('div');
      box.className = 'video-box' + (isScreen ? ' screen-share' : '');
      box.id = boxId;
      box.innerHTML = `
        <div class="name-tag">${isScreen ? '🖥️ ' : '👤 '}${name}</div>
        <div class="status-tag">🟢 Live</div>
        <div class="expand-icon">🔍 ចុចមើលធំ</div>
      `;
      box.insertBefore(videoElement, box.firstChild);
      document.getElementById(gridId).appendChild(box);
      
      box.onclick = () => openFullscreen(videoElement, name, isScreen);
      
      if (isScreen) document.getElementById('screenTitle').style.display = 'flex';
      updateVideoCounts();
    }

    function openFullscreen(videoElement, name, isScreen) {
      const modal = document.getElementById('fullscreenModal');
      const modalBody = document.getElementById('modalBody');
      document.getElementById('modalTitle').textContent = (isScreen ? '🖥️ ' : '👤 ') + name;
      modalBody.innerHTML = '';
      
      const newVideo = document.createElement('video');
      newVideo.autoplay = true;
      newVideo.playsInline = true;
      newVideo.muted = videoElement.muted;
      newVideo.srcObject = videoElement.srcObject;
      
      modalBody.appendChild(newVideo);
      modal.classList.add('active');
    }

    function closeFullscreen() {
      document.getElementById('fullscreenModal').classList.remove('active');
      document.getElementById('modalBody').innerHTML = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeFullscreen();
      if (e.key === 'Enter' && pendingLoginData) verifyOTP();
    });

    function removeVideoByParticipant(name, isScreen = false) {
      const safeName = name.replace(/[^a-zA-Z0-9\u1780-\u17FF]/g, '-');
      const box = document.getElementById((isScreen ? 'screen-' : 'video-') + safeName);
      if (box) box.remove();
      
      if (isScreen) {
        if (document.getElementById('screenGrid').children.length === 0) {
          document.getElementById('screenTitle').style.display = 'none';
        }
      }
      updateVideoCounts();
    }

    function updateVideoCounts() {
      document.getElementById('screenCount').textContent = document.getElementById('screenGrid').children.length;
      document.getElementById('videoCount').textContent = document.getElementById('videoGrid').children.length;
    }

    function updateMediaButtons() {
      const btnMic = document.getElementById('btnMic');
      btnMic.innerHTML = isMicOn ? '🎤 បើកមេក្រូ' : '🔇 បិទមេក្រូ';
      btnMic.className = isMicOn ? 'btn-primary' : 'btn-primary off';
      
      const btnCam = document.getElementById('btnCam');
      btnCam.innerHTML = isCameraOn ? '📹 បើកកាមេរ៉ា' : '📷 បិទកាមេរ៉ា';
      btnCam.className = isCameraOn ? 'btn-primary' : 'btn-primary off';
    }

    async function toggleMic() {
      if (!localParticipant) return;
      try {
        isMicOn = !isMicOn;
        await localParticipant.setMicrophoneEnabled(isMicOn);
        updateMediaButtons();
      } catch (error) {}
    }

    async function toggleCamera() {
      if (!localParticipant) return;
      try {
        isCameraOn = !isCameraOn;
        await localParticipant.setCameraEnabled(isCameraOn);
        updateMediaButtons();
        if (!isCameraOn) removeVideoByParticipant(localParticipant.identity + ' (អ្នក)', false);
      } catch (error) {}
    }

    async function toggleScreenShare() {
      if (!localParticipant) return;
      
      if (isMobile && !navigator.mediaDevices.getDisplayMedia) {
        return showStatus('⚠️ ទូរស័ព្ទមិនអាចចែកអេក្រង់បានទេ!');
      }
      
      try {
        isScreenSharing = !isScreenSharing;
        await localParticipant.setScreenShareEnabled(isScreenSharing, {
          audio: true,
          video: { resolution: LivekitClient.VideoPresets.h1080.resolution }
        });
        
        const btn = document.getElementById('btnScreen');
        btn.innerHTML = isScreenSharing ? '🛑 ឈប់' : '🖥️ ចែកអេក្រង់';
        btn.className = isScreenSharing ? 'btn-danger' : 'btn-warning';
        
        if (!isScreenSharing) {
          removeVideoByParticipant(localParticipant.identity + ' (អ្នក)', true);
        }
      } catch (error) {
        isScreenSharing = false;
      }
    }

    function addParticipantToList(name) {
      const list = document.getElementById('participantsList');
      const safeName = name.replace(/[^a-zA-Z0-9\u1780-\u17FF]/g, '-');
      const itemId = 'p-' + safeName;
      if (document.getElementById(itemId)) return;
      
      const item = document.createElement('div');
      item.className = 'participant-item';
      item.id = itemId;
      
      const isSelf = name.includes('អ្នក') || name === currentUser.username;
      const remoteBtn = (!isSelf) ? `<button class="remote-btn" onclick="requestRemote('${name}')">🖥️ Remote</button>` : '';
      
      item.innerHTML = `
        <div class="info"><div class="dot"></div> ${name}</div>
        ${remoteBtn}
      `;
      list.appendChild(item);
    }

    function removeParticipantFromList(name) {
      const safeName = name.replace(/[^a-zA-Z0-9\u1780-\u17FF]/g, '-');
      const item = document.getElementById('p-' + safeName);
      if (item) item.remove();
    }

    function updateParticipantCount() {
      if (!room) return;
      const count = room.remoteParticipants.size + 1;
      document.getElementById('participantCount').textContent = count;
      if (localParticipant) addParticipantToList(localParticipant.identity + ' (អ្នក)');
    }

    // ============================================================
    // REMOTE CONTROL
    // ============================================================
    async function requestRemote(targetName) {
      if (!confirm(`ស្នើសុំគ្រប់គ្រង Screen របស់ ${targetName}?`)) return;
      
      try {
        const res = await fetch('/api/remote/request', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            targetId: targetName.replace(' (អ្នក)', ''),
            targetName: targetName,
            roomId: document.getElementById('currentRoom').textContent
          })
        });
        
        if (res.ok) {
          showStatus('📨 ស្នើសុំរួចរាល់!');
        }
      } catch (error) {
        showStatus('❌ មិនអាចស្នើសុំបានទេ');
      }
    }

    async function checkRemoteRequests() {
      try {
        const res = await fetch(`/api/remote/requests/${currentUser.username}`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        
        if (data.requests && data.requests.length > 0) {
          currentRemoteRequest = data.requests[0];
          document.getElementById('remoteRequesterName').textContent = currentRemoteRequest.controllerName;
          document.getElementById('remoteRequestModal').classList.add('active');
        }
      } catch (error) {}
    }

    async function approveRemote() {
      if (!currentRemoteRequest) return;
      try {
        await fetch(`/api/remote/requests/${currentRemoteRequest._id}`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ status: 'approved' })
        });
        
        document.getElementById('remoteRequestModal').classList.remove('active');
        showStatus('✅ អនុញ្ញាតរួចរាល់!');
        currentRemoteRequest = null;
      } catch (error) {}
    }

    async function rejectRemote() {
      if (!currentRemoteRequest) return;
      try {
        await fetch(`/api/remote/requests/${currentRemoteRequest._id}`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ status: 'rejected' })
        });
        
        document.getElementById('remoteRequestModal').classList.remove('active');
        showStatus('❌ បដិសេធរួចរាល់');
        currentRemoteRequest = null;
      } catch (error) {}
    }

    setInterval(() => {
      if (room && currentUser) checkRemoteRequests();
    }, 5000);

    // ============================================================
    // LEAVE ROOM
    // ============================================================
    async function leaveRoom(showLobby = true) {
      if (room) {
        try { await room.disconnect(); } catch (e) {}
        room = null;
        localParticipant = null;
      }
      
      try {
        await fetch('/api/online/leave', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          }
        });
      } catch (e) {}
      
      document.getElementById('videoGrid').innerHTML = '';
      document.getElementById('screenGrid').innerHTML = '';
      document.getElementById('participantsList').innerHTML = '';
      document.getElementById('screenTitle').style.display = 'none';
      document.getElementById('app').classList.remove('active');
      
      isMicOn = false;
      isCameraOn = false;
      isScreenSharing = false;
      
      // ✅ Admin/Supervisor ត្រឡប់ទៅ Dashboard
      if (currentUser && (currentUser.role === 'admin' || currentUser.role === 'supervisor')) {
        showStatus('🚪 ត្រឡប់ទៅ Dashboard...');
        setTimeout(() => {
          window.location.href = '/admin.html';
        }, 800);
        return;
      }
      
      if (showLobby) {
        showLogin();
        await loadPublicRooms();
        showStatus('🚪 ចាកចេញពីបន្ទប់');
      }
    }

    function showStatus(message) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.classList.add('show');
      clearTimeout(status.timeout);
      status.timeout = setTimeout(() => status.classList.remove('show'), 4000);
    }

    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
