<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Kantumruy Pro', 'Noto Sans Khmer', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { background: #0b132b; color: #fff; min-height: 100vh; padding: 20px; line-height: 1.6; }
    
    .container { max-width: 1300px; margin: 0 auto; }
    
    .header {
      background: #1c2541;
      padding: 25px 30px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border: 1px solid #2d2d44;
    }
    .header h1 { color: #48cae4; font-size: 24px; }
    .header .user-info { color: #94a3b8; font-size: 14px; }
    .header .user-info strong { color: #48cae4; }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: #00b4d8; color: #fff; }
    .btn-primary:hover { background: #0096c7; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn-secondary { background: #475569; color: #fff; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: #1c2541;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #2d2d44;
      text-align: center;
    }
    .stat-card .stat-value {
      font-size: 36px;
      font-weight: bold;
      color: #48cae4;
      margin-bottom: 5px;
    }
    .stat-card .stat-label {
      font-size: 13px;
      color: #94a3b8;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 12px 24px;
      background: #1c2541;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .tab-btn.active { background: #00b4d8; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .card {
      background: #1c2541;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid #2d2d44;
    }
    .card h2 {
      color: #48cae4;
      margin-bottom: 20px;
      font-size: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #2d2d44;
    }
    
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    
    input, select {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #3a506b;
      background: #0b132b;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus { border-color: #48cae4; }
    
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      padding: 12px;
      background: #0b132b;
      border-radius: 8px;
      border: 1px solid #2d2d44;
      max-height: 150px;
      overflow-y: auto;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #1c2541;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .checkbox-group input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #2d2d44;
      font-size: 14px;
    }
    th {
      background: #0b132b;
      color: #48cae4;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    tr:hover { background: #16213e; }
    
    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }
    .badge-admin { background: #f59e0b; color: #000; }
    .badge-supervisor { background: #8b5cf6; color: #fff; }
    .badge-user { background: #00b4d8; color: #fff; }
    .badge-active { background: #10b981; color: #fff; }
    .badge-inactive { background: #ef4444; color: #fff; }
    
    .action-buttons {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .action-buttons button {
      padding: 6px 10px;
      font-size: 12px;
    }
    
    .alert {
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }
    .alert.show { display: block; }
    .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; }
    .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; }
    
    .room-monitor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }
    .room-monitor-card {
      background: #0b132b;
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #2d2d44;
      cursor: pointer;
      transition: all 0.2s;
    }
    .room-monitor-card:hover {
      border-color: #48cae4;
      transform: translateY(-3px);
    }
    .room-monitor-card.live {
      border-color: #10b981;
    }
    .room-monitor-card h4 {
      color: #48cae4;
      margin-bottom: 10px;
    }
    .room-monitor-card .online-count {
      font-size: 24px;
      font-weight: bold;
      color: #10b981;
      margin: 10px 0;
    }
    .room-monitor-card .user-list {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
      max-height: 100px;
      overflow-y: auto;
    }
    .room-monitor-card .join-hint {
      margin-top: 10px;
      padding: 8px;
      background: #16213e;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      color: #48cae4;
    }
    
    .loading { text-align: center; padding: 40px; color: #94a3b8; }
    
    @media (max-width: 768px) {
      .header { flex-direction: column; align-items: flex-start; }
      .form-grid { grid-template-columns: 1fr; }
      table { font-size: 12px; }
      th, td { padding: 8px; }
      .action-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <h1>👑 Admin Dashboard</h1>
        <div class="user-info">ចូលជា: <strong id="adminName">-</strong> <span id="adminRole"></span></div>
      </div>
      <div>
        <button class="btn btn-primary" onclick="window.location.href='/'">🏠 ទំព័រដើម</button>
        <button class="btn btn-danger" onclick="adminLogout()">🚪 ចាកចេញ</button>
      </div>
    </div>

    <div id="alert" class="alert"></div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalUsers">0</div>
        <div class="stat-label">👥 អ្នកប្រើសរុប</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalRooms">0</div>
        <div class="stat-label">🚪 បន្ទប់សរុប</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeUsers">0</div>
        <div class="stat-label">✅ សកម្ម</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalOnline">0</div>
        <div class="stat-label">🟢 កំពុង Online</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('rooms', event)">📡 តាមដានបន្ទប់</button>
      <button class="tab-btn" onclick="switchTab('users', event)">👥 គ្រប់គ្រង Users</button>
      <button class="tab-btn" onclick="switchTab('create', event)" id="createTabBtn">➕ បង្កើតថ្មី</button>
    </div>

    <!-- Tab: Rooms -->
    <div id="tab-rooms" class="tab-content active">
      <div class="card">
        <h2>📡 តាមដានបន្ទប់សកម្ម</h2>
        <p style="color:#94a3b8; margin-bottom:20px; font-size:14px;">
          💡 ចុចលើបន្ទប់ដើម្បីចូលមើល
        </p>
        <div id="roomsMonitor" class="room-monitor-grid">
          <div class="loading">⏳ កំពុងផ្ទុក...</div>
        </div>
      </div>
    </div>

    <!-- Tab: Users -->
    <div id="tab-users" class="tab-content">
      <div class="card">
        <h2>👥 បញ្ជីអ្នកប្រើ</h2>
        <div id="usersLoading" class="loading">⏳ កំពុងផ្ទុក...</div>
        <table id="usersTable" style="display:none;">
          <thead>
            <tr>
              <th>Username</th>
              <th>Display Name</th>
              <th>Role</th>
              <th>បន្ទប់</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Tab: Create -->
    <div id="tab-create" class="tab-content">
      <!-- Create User -->
      <div class="card">
        <h2>➕ បង្កើតអ្នកប្រើថ្មី</h2>
        <div class="form-grid">
          <input type="text" id="newUsername" placeholder="Username">
          <input type="text" id="newDisplayName" placeholder="Display Name">
          <input type="password" id="newPassword" placeholder="Password">
          <select id="newRole">
            <option value="user">User (អ្នកប្រើធម្មតា)</option>
            <option value="supervisor">Supervisor (អ្នកត្រួតពិនិត្យ)</option>
            <option value="admin">Admin (អ្នកគ្រប់គ្រង)</option>
          </select>
        </div>
        <div style="margin-bottom: 15px;">
          <label style="display:block; margin-bottom:8px; color:#94a3b8; font-size:13px;">🚪 បន្ទប់ដែលអនុញ្ញាត:</label>
          <div id="roomsCheckbox" class="checkbox-group"></div>
        </div>
        <button class="btn btn-success" onclick="createUser()">➕ បង្កើត User</button>
      </div>

      <!-- Create Room -->
      <div class="card">
        <h2>➕ បង្កើតបន្ទប់ថ្មី</h2>
        <div class="form-grid">
          <input type="text" id="newRoomId" placeholder="Room ID (ឧ. meeting-4)">
          <input type="text" id="newRoomName" placeholder="ឈ្មោះបន្ទប់">
        </div>
        <button class="btn btn-primary" onclick="createRoom()">➕ បង្កើតបន្ទប់</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('authToken');
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');

    if (!token || (user.role !== 'admin' && user.role !== 'supervisor')) {
      alert('អ្នកគ្មានសិទ្ធិ!');
      window.location.href = '/';
    }

    document.getElementById('adminName').textContent = user.displayName || user.username;
    document.getElementById('adminRole').innerHTML = `<span class="badge badge-${user.role}">${user.role.toUpperCase()}</span>`;

    // ✅ Supervisor មិនអាចបង្កើត User បានទេ
    if (user.role === 'supervisor') {
      document.getElementById('createTabBtn').style.display = 'none';
    }

    function showAlert(message, type = 'success') {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = 'alert alert-' + type + ' show';
      setTimeout(() => alert.classList.remove('show'), 3000);
    }

    function switchTab(tab, event) {
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
      
      if (tab === 'rooms') loadRoomsMonitor();
      if (tab === 'users') loadUsers();
      if (tab === 'create') loadRoomsForCheckbox();
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        document.getElementById('totalUsers').textContent = data.totalUsers;
        document.getElementById('totalRooms').textContent = data.totalRooms;
        document.getElementById('activeUsers').textContent = data.activeUsers;
        document.getElementById('totalOnline').textContent = data.totalOnline;
      } catch (error) {}
    }

    // ============================================================
    // ROOMS MONITOR - ✅ អាចចុចចូលបន្ទប់
    // ============================================================
    async function loadRoomsMonitor() {
      try {
        const res = await fetch('/api/online/rooms-status', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        const container = document.getElementById('roomsMonitor');
        container.innerHTML = '';
        
        if (data.rooms.length === 0) {
          container.innerHTML = '<div class="loading">គ្មានបន្ទប់ទេ</div>';
          return;
        }
        
        data.rooms.forEach(room => {
          const isLive = room.onlineCount > 0;
          const card = document.createElement('div');
          card.className = 'room-monitor-card' + (isLive ? ' live' : '');
          card.innerHTML = `
            <h4>🚪 ${room.roomName || room.roomId}</h4>
            <div class="online-count">🟢 ${room.onlineCount} នាក់</div>
            <div class="user-list">
              ${room.users.length > 0 ? '👥 ' + room.users.join(', ') : '<em>គ្មានអ្នកចូល</em>'}
            </div>
            <div class="join-hint">🔗 ចុចដើម្បីចូលបន្ទប់នេះ</div>
          `;
          card.onclick = () => joinRoomFromAdmin(room.roomId);
          container.appendChild(card);
        });
      } catch (error) {}
    }

    // ✅ ចុចលើបន្ទប់ → ចូលបន្ទប់ភ្លាម (មិនត្រូវការ Redirect)
async function joinRoomFromAdmin(roomId) {
  console.log('🚀 Joining room from admin:', roomId);
  
  // បង្ហាញ Loading
  const overlay = document.createElement('div');
  overlay.id = 'loadingOverlay';
  overlay.style.cssText = `
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 99999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
  `;
  overlay.innerHTML = `
    <div style="color:#48cae4; font-size:24px; font-weight:bold;">⏳ កំពុងចូលបន្ទប់ ${roomId}...</div>
    <div style="color:#94a3b8; font-size:14px;">សូមរង់ចាំបន្តិច</div>
  `;
  document.body.appendChild(overlay);
  
  // បញ្ជូនទៅ index.html ជាមួយ autoJoinRoom
  localStorage.setItem('autoJoinRoom', roomId);
  localStorage.setItem('autoJoinFromAdmin', 'true');
  window.location.href = '/?autoJoin=' + roomId;
}

    // ============================================================
    // USERS
    // ============================================================
    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';
        
        data.users.forEach(u => {
          const tr = document.createElement('tr');
          const roomsText = u.assignedRooms.includes('*') ? 'ទាំងអស់' : (u.assignedRooms.join(', ') || 'គ្មាន');
          
          // ✅ Supervisor មិនអាចកែ Admin បានទេ
          const canEdit = !(user.role === 'supervisor' && u.role === 'admin');
          
          let actions = '';
          if (canEdit) {
            actions = `
              <div class="action-buttons">
                ${user.role === 'admin' ? `
                  <button class="btn btn-warning" onclick="toggleUser('${u._id}')">${u.isActive ? '🚫 ផ្អាក' : '✅ សកម្ម'}</button>
                  <button class="btn btn-primary" onclick="resetPassword('${u._id}', '${u.username}')">🔑 Reset</button>
                  ${u.role !== 'admin' ? `<button class="btn btn-danger" onclick="deleteUser('${u._id}', '${u.username}')">🗑️ លុប</button>` : ''}
                ` : `
                  <button class="btn btn-primary" onclick="resetPassword('${u._id}', '${u.username}')">🔑 Reset</button>
                `}
              </div>
            `;
          } else {
            actions = '<span style="color:#64748b;">គ្មានសិទ្ធិ</span>';
          }
          
          tr.innerHTML = `
            <td><strong>${u.username}</strong></td>
            <td>${u.displayName || '-'}</td>
            <td><span class="badge badge-${u.role}">${u.role}</span></td>
            <td style="font-size:12px;">${roomsText}</td>
            <td><span class="badge badge-${u.isActive ? 'active' : 'inactive'}">${u.isActive ? 'សកម្ម' : 'អសកម្ម'}</span></td>
            <td>${actions}</td>
          `;
          tbody.appendChild(tr);
        });
        
        document.getElementById('usersLoading').style.display = 'none';
        document.getElementById('usersTable').style.display = 'table';
      } catch (error) {}
    }

    async function toggleUser(id) {
      try {
        const res = await fetch(`/api/admin/users/${id}/toggle`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showAlert('✅ ប្តូរស្ថានភាពជោគជ័យ!');
        loadUsers();
      } catch (error) {
        showAlert('❌ ' + error.message, 'error');
      }
    }

    async function resetPassword(id, username) {
      const newPassword = prompt(`Password ថ្មីសម្រាប់ "${username}":`);
      if (!newPassword || newPassword.length < 4) return showAlert('Password ត្រូវមាន ៤ តួ!', 'error');
      
      try {
        const res = await fetch(`/api/admin/users/${id}`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ newPassword })
        });
        if (!res.ok) throw new Error('Failed');
        showAlert('✅ ប្តូរ Password ជោគជ័យ!');
      } catch (error) {
        showAlert('❌ មិនអាចប្តូរបានទេ', 'error');
      }
    }

    async function deleteUser(id, username) {
      if (!confirm(`លុប "${username}"?`)) return;
      try {
        const res = await fetch(`/api/admin/users/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed');
        showAlert('✅ លុបជោគជ័យ!');
        loadUsers();
      } catch (error) {
        showAlert('❌ មិនអាចលុបបានទេ', 'error');
      }
    }

    // ============================================================
    // CREATE USER
    // ============================================================
    async function loadRoomsForCheckbox() {
      try {
        const res = await fetch('/api/admin/rooms', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        const container = document.getElementById('roomsCheckbox');
        container.innerHTML = `
          <label>
            <input type="checkbox" value="*" id="allRoomsCheck">
            <strong>🌐 បន្ទប់ទាំងអស់</strong>
          </label>
        `;
        
        data.rooms.forEach(room => {
          const label = document.createElement('label');
          label.innerHTML = `
            <input type="checkbox" value="${room.roomId}" class="room-check">
            ${room.roomName || room.roomId}
          `;
          container.appendChild(label);
        });
        
        document.getElementById('allRoomsCheck').onchange = function() {
          document.querySelectorAll('.room-check').forEach(cb => {
            cb.checked = this.checked;
            cb.disabled = this.checked;
          });
        };
      } catch (error) {}
    }

    async function createUser() {
      const username = document.getElementById('newUsername').value.trim();
      const displayName = document.getElementById('newDisplayName').value.trim();
      const password = document.getElementById('newPassword').value;
      const role = document.getElementById('newRole').value;
      
      if (!username || !password) return showAlert('សូមបំពេញ Username និង Password!', 'error');
      if (password.length < 4) return showAlert('Password ត្រូវមាន ៤ តួ!', 'error');
      
      const assignedRooms = [];
      if (document.getElementById('allRoomsCheck').checked) {
        assignedRooms.push('*');
      } else {
        document.querySelectorAll('.room-check:checked').forEach(cb => {
          assignedRooms.push(cb.value);
        });
      }
      
      if (assignedRooms.length === 0) return showAlert('សូមជ្រើសរើសបន្ទប់យ៉ាងតិច ១!', 'error');
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ username, password, displayName, role, assignedRooms })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        
        showAlert('✅ បង្កើត User ជោគជ័យ!');
        document.getElementById('newUsername').value = '';
        document.getElementById('newDisplayName').value = '';
        document.getElementById('newPassword').value = '';
        loadUsers();
        loadStats();
      } catch (error) {
        showAlert('❌ ' + error.message, 'error');
      }
    }

    // ============================================================
    // CREATE ROOM
    // ============================================================
    async function createRoom() {
      const roomId = document.getElementById('newRoomId').value.trim();
      const roomName = document.getElementById('newRoomName').value.trim();
      
      if (!roomId) return showAlert('សូមបំពេញ Room ID!', 'error');
      
      try {
        const res = await fetch('/api/admin/rooms', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ roomId, roomName })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        
        showAlert('✅ បង្កើតបន្ទប់ជោគជ័យ!');
        document.getElementById('newRoomId').value = '';
        document.getElementById('newRoomName').value = '';
        loadRoomsForCheckbox();
        loadStats();
      } catch (error) {
        showAlert('❌ ' + error.message, 'error');
      }
    }

    // ============================================================
    // LOGOUT
    // ============================================================
    async function adminLogout() {
      if (!confirm('ចាកចេញពីគណនីទេ?')) return;
      
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });
      } catch (e) {}
      
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
      localStorage.removeItem('deviceId');
      window.location.href = '/';
    }

    // ============================================================
    // INITIAL LOAD
    // ============================================================
    loadStats();
    loadRoomsMonitor();
    
    setInterval(() => {
      loadStats();
      if (document.getElementById('tab-rooms').classList.contains('active')) {
        loadRoomsMonitor();
      }
    }, 10000);
  </script>
</body>
</html>
